bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true



planner_server:
  ros__parameters:
    use_sim_time: true

    # This only controls the planning-duration warning threshold.
    expected_planner_frequency: 1.0

    planner_plugins: ["GridBased"]

    GridBased3:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      tolerance: 0.20
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.5

      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72

      # Must match MPPI AckermannConstraints.min_turning_r
      minimum_turning_radius: 0.10

      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015

      analytic_expansion_ratio: 3.5

      # Keep at least around 4–5 × minimum_turning_radius
      analytic_expansion_max_length: 3.0

      lookup_table_size: 20.0

      # true is useful for repeated replanning to the same goal
      # when the global costmap is mostly static
      cache_obstacle_heuristic: true

      smooth_path: true

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"

      tolerance: 0.10

      downsample_costmap: false
      downsampling_factor: 1

      allow_unknown: false

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.5

      cost_travel_multiplier: 2.0

      # false = final path pose uses requested goal orientation
      use_final_approach_orientation: false

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 0.025
        do_refinement: true
    GridBased2:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 64
      minimum_turning_radius: 0.10

      reverse_penalty: 2.1
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0

      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true
    GridBased3:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.22
      resolution: 0.05
      trinary_costmap: false
      track_unknown_space: true
      always_send_full_costmap: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: map
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.4



controller_server:
  ros__parameters:
    use_sim_time: true
    speed_limit_topic: speed_limit

    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.05

    FollowPath2:
      plugin: "nav2_mppi_controller::MPPIController"

      # 56 × 0.05 = 2.8-second prediction horizon
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1

      # Ackermann is non-holonomic
      vy_std: 0.0
      vy_max: 0.0

      vx_std: 0.3
      wz_std: 0.6

      vx_max: 1.0
      vx_min: -1.0

      # Example: 0.50 / 0.40 = 1.25 rad/s
      wz_max: 3.0

      temperature: 0.3
      gamma: 0.015
      retry_attempt_limit: 1

      prune_distance: 1.7
      transform_tolerance: 0.1
      reset_period: 1.0

      motion_model: "Ackermann"

      AckermannConstraints:
        # Must match planner minimum_turning_radius
        min_turning_r: 0.10

      # Important when following a Reeds–Shepp path
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4

      visualize: false
      regenerate_noises: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathAngleCritic
        - PathFollowCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.5

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20

        # Follow orientations supplied by Smac Hybrid
        use_path_orientations: true

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2

        # Allow reverse segments selected by Reeds–Shepp
        forward_preference: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 6
        threshold_to_consider: 1.4

    FollowPath1:
      plugin: "nav2_mppi_controller::MPPIController"

      # Prediction: 56 × 0.05 = 2.8 seconds
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1

      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4

      vx_max: 1.0
      vx_min: -1.0
      vy_max: 0.0
      wz_max: 3.0

      prune_distance: 1.7
      transform_tolerance: 0.1

      temperature: 0.3
      gamma: 0.015
      retry_attempt_limit: 1
      reset_period: 1.0

      motion_model: "DiffDrive"

      # Use true only while tuning
      visualize: false
      regenerate_noises: false

      # Keep false for NavFn / SmacPlanner2D
      enforce_path_inversion: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathAngleCritic
        - PathFollowCritic
        - PreferForwardCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.5

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      max_vel_x: 1.0
      min_vel_x: -1.0
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_vel_theta: 1.0
      min_vel_theta: 0.0
      max_speed_xy: 0.8
      min_speed_xy: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.5
      decel_lim_x: -2.5
      acc_lim_y: 0.0
      decel_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: [
        "RotateToGoal",
        "Oscillation",
        "BaseObstacle",
        "GoalAlign",
        "PathAlign",
        "PathDist",
        "GoalDist"
      ]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      trinary_costmap: false
      always_send_full_costmap: True
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: map
        map_subscribe_transient_local: True
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.4
      filters: ["speed_filter"]
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: True
        filter_info_topic: speed_costmap_filter_info
        speed_limit_topic: speed_limit

speed_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: true
    type: 1
    filter_info_topic: speed_costmap_filter_info
    mask_topic: speed_filter_mask
    base: 100.0
    multiplier: -1.0

speed_filter_mask_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: limo_world.speed.yaml
    topic_name: speed_filter_mask
    frame_id: map

contour_map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: limo_world.yaml
    topic_name: contour_map
    frame_id: map



behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"



waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
