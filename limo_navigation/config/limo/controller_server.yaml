controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: odom_ekf/filtered
    speed_limit_topic: speed_limit

    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.05

    FollowPath2:
      plugin: "nav2_mppi_controller::MPPIController"

      # 56 × 0.05 = 2.8-second prediction horizon
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1

      # Ackermann is non-holonomic
      vy_std: 0.0
      vy_max: 0.0

      vx_std: 0.3
      wz_std: 0.6

      vx_max: 1.0
      vx_min: -1.0

      # Example: 0.50 / 0.40 = 1.25 rad/s
      wz_max: 3.0

      temperature: 0.3
      gamma: 0.015
      retry_attempt_limit: 1

      prune_distance: 1.7
      transform_tolerance: 0.1
      reset_period: 1.0

      motion_model: "Ackermann"

      AckermannConstraints:
        # Must match planner minimum_turning_radius
        min_turning_r: 0.10

      # Important when following a Reeds–Shepp path
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4

      visualize: false
      regenerate_noises: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathAngleCritic
        - PathFollowCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.5

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20

        # Follow orientations supplied by Smac Hybrid
        use_path_orientations: true

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2

        # Allow reverse segments selected by Reeds–Shepp
        forward_preference: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 6
        threshold_to_consider: 1.4

    FollowPath1:
      plugin: "nav2_mppi_controller::MPPIController"

      # Prediction: 56 × 0.05 = 2.8 seconds
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1

      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4

      vx_max: 1.0
      vx_min: -1.0
      vy_max: 0.0
      wz_max: 3.0

      prune_distance: 1.7
      transform_tolerance: 0.1

      temperature: 0.3
      gamma: 0.015
      retry_attempt_limit: 1
      reset_period: 1.0

      motion_model: "DiffDrive"

      # Use true only while tuning
      visualize: false
      regenerate_noises: false

      # Keep false for NavFn / SmacPlanner2D
      enforce_path_inversion: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathAngleCritic
        - PathFollowCritic
        - PreferForwardCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.5

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
    # DWB parameters
    FollowPath4:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      prune_distance: 0.5
      max_vel_x: 0.5
      min_vel_x: -0.2
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_vel_theta: 1.5
      min_vel_theta: 0.0
      max_speed_xy: 0.8
      min_speed_xy: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.5
      decel_lim_x: -2.5
      acc_lim_y: 0.0
      decel_lim_y: 0.0
      acc_lim_theta: 6.0
      decel_lim_theta: -6.0
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: [
        "RotateToGoal",
        "Oscillation",
        "BaseObstacle",
        "GoalAlign",
        "PathAlign",
        "PathDist",
        "GoalDist"
      ]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # ==========================================================
      # 1. MAIN SPEED
      # ==========================================================

      # Main forward/reverse tracking speed for Humble RPP
      desired_linear_vel: 0.5


      # ==========================================================
      # 2. LOOKAHEAD / PATH TRACKING
      # ==========================================================

      # Used when velocity-scaled lookahead is FALSE
      lookahead_dist: 0.25

      # Used when velocity-scaled lookahead is TRUE
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.30
      lookahead_time: 1.0

      # Adaptive carrot based on current robot speed
      use_velocity_scaled_lookahead_dist: true


      # ==========================================================
      # 3. TF
      # ==========================================================

      transform_tolerance: 0.20


      # ==========================================================
      # 4. GOAL APPROACH
      # ==========================================================

      # Lowest commanded linear speed while approaching end of path
      min_approach_linear_velocity: 0.02

      # Distance over which RPP begins reducing speed near goal
      approach_velocity_scaling_dist: 0.80


      # ==========================================================
      # 5. COLLISION DETECTION
      # ==========================================================

      use_collision_detection: true

      # Predict current command forward for collision checking
      max_allowed_time_to_collision_up_to_carrot: 1.0


      # ==========================================================
      # 6. CURVATURE-BASED SPEED REGULATION
      # ==========================================================

      # Slow robot on sharp curves
      use_regulated_linear_velocity_scaling: true

      # Curves tighter than approximately this radius get regulated
      regulated_linear_scaling_min_radius: 1.00

      # Lowest speed curvature regulation may command
      regulated_linear_scaling_min_speed: 0.15


      # ==========================================================
      # 7. COST / OBSTACLE-PROXIMITY SPEED REGULATION
      # ==========================================================

      # Keep false first while tuning
      use_cost_regulated_linear_velocity_scaling: false

      # Only relevant when above is true
      # Must not exceed your local costmap inflation radius
      cost_scaling_dist: 0.20

      # Lower than 1.0 = stronger slowing near obstacles
      cost_scaling_gain: 1.0

      # MUST match local_costmap inflation_layer.cost_scaling_factor
      inflation_cost_scaling_factor: 10.0


      # ==========================================================
      # 8. ROTATE-TO-HEADING
      # ==========================================================

      # FALSE because you want reverse parking
      use_rotate_to_heading: true

      # These remain valid Humble parameters,
      # but won't control behavior while rotate-to-heading is false
      rotate_to_heading_angular_vel: 0.50
      rotate_to_heading_min_angle: 0.40

      # Used to limit angular acceleration during rotate-to-heading
      max_angular_accel: 1.0


      # ==========================================================
      # 9. REVERSING
      # ==========================================================

      # TRUE for your reverse-parking requirement
      allow_reversing: false


      # ==========================================================
      # 10. GLOBAL PATH SEARCH
      # ==========================================================

      # Maximum distance along the plan to search for nearest pose.
      # 1.5 m is suitable with your 3 x 3 m local costmap as a
      # conservative starting value.
      max_robot_pose_search_dist: 0.40


      # ==========================================================
      # 11. PATH INTERPOLATION
      # ==========================================================

      # Interpolate between path points when selecting carrot
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      transform_tolerance: 0.3
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.18
      trinary_costmap: false
      always_send_full_costmap: True
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        transform_tolerance: 0.3
        map_topic: map
        map_subscribe_transient_local: True
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.23
      filters: ["speed_filter"]
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        transform_tolerance: 0.3
        enabled: True
        filter_info_topic: speed_costmap_filter_info
        speed_limit_topic: speed_limit