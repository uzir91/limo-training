planner_server:
  ros__parameters:
    use_sim_time: true

    # This only controls the planning-duration warning threshold.
    expected_planner_frequency: 1.0

    planner_plugins: ["GridBased"]

    GridBased3:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      tolerance: 0.20
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.5

      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72

      # Must match MPPI AckermannConstraints.min_turning_r
      minimum_turning_radius: 0.10

      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015

      analytic_expansion_ratio: 3.5

      # Keep at least around 4–5 × minimum_turning_radius
      analytic_expansion_max_length: 3.0

      lookup_table_size: 20.0

      # true is useful for repeated replanning to the same goal
      # when the global costmap is mostly static
      cache_obstacle_heuristic: true

      smooth_path: true

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"

      tolerance: 0.10

      downsample_costmap: false
      downsampling_factor: 1

      allow_unknown: false

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.5

      cost_travel_multiplier: 2.0

      # false = final path pose uses requested goal orientation
      use_final_approach_orientation: false

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 0.025
        do_refinement: true
    GridBased2:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 64
      minimum_turning_radius: 0.10

      reverse_penalty: 2.1
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0

      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true
    GridBased3:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.18
      resolution: 0.05
      trinary_costmap: false
      track_unknown_space: true
      always_send_full_costmap: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: map
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: scan/data
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.23
      # filters: ["speed_filter"]
      # speed_filter:
      #   plugin: "nav2_costmap_2d::SpeedFilter"
      #   enabled: True
      #   filter_info_topic: speed_costmap_filter_info
      #   speed_limit_topic: speed_limit
      #   transform_tolerance: 0.2