/**:
  ros__parameters:
    language: "eng"
    tessdata_path: ""

    # Tesseract OEM: 0 legacy, 1 LSTM, 2 combined, 3 default.
    engine_mode: 1

    # Tesseract PSM: 6 treats the image as one uniform text block.
    page_segmentation_mode: 6

    preserve_interword_spaces: false
    trim_text: true

    # Shared per-word output filter for both stream and action OCR.
    ocr:
      minimum_confidence: 85.0

    stream:
      input_topic: "camera/color/image_raw"
      output_topic: "ocr/annotation"
      include_words: true

      input_qos:
        depth: 1
        reliability: "best_effort"
        durability: "volatile"

      output_qos:
        depth: 10
        reliability: "reliable"
        durability: "volatile"

    # Filtering always converts the image to mono8. No image work is done
    # unless the OCR result topic or filtered image topic has subscribers,
    # or an action goal is active.
    filter:
      output_topic: "image/filtered"
      threshold_mode: "none"  # none or otsu

    action:
      enabled: true
      name: "ocr"
      maximum_queue_size: 8
      required_matches: 2
